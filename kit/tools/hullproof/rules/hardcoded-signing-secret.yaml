rules:
  - id: hullproof-hardcoded-signing-secret
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A string literal that looks like a signing secret, key or token is assigned to a name that says secret, key or token.
      Anyone who can read the repository, a build artifact or the browser bundle can sign requests or tokens with it. Read the
      value from an environment variable or a secret store, rotate the value, and remove it from the history.
    patterns:
      - pattern-either:
          - pattern: const $N = "$LIT"
          - pattern: let $N = "$LIT"
          - pattern: var $N = "$LIT"
          - pattern: $O.$N = "$LIT"
          - pattern: '{..., $N: "$LIT", ...}'
          - pattern: '{..., "$N": "$LIT", ...}'
      - metavariable-regex:
          metavariable: $N
          regex: (?i)^[\w$]*(secret|key|token)[\w$]*$
      - metavariable-regex:
          metavariable: $N
          regex: (?i)^(?!.*(public|publishable|anon|cache|primary|foreign|sort|row|react|storage|query|translation|i18n|header|prefix|cookie|name|label|param|field|column|idempotency|csrf_?header)).*$
      - metavariable-regex:
          metavariable: $LIT
          regex: ^(?=.*[0-9])(?=.*[A-Za-z])[A-Za-z0-9+/=_.\-]{20,}$
      - metavariable-regex:
          metavariable: $LIT
          regex: (?i)^(?!.*(your|change|example|placeholder|dummy|sample|xxxx|todo|replace|insert|fake|test|localhost|process)).*$
      - focus-metavariable: $LIT
    metadata:
      sec_ids: [SEC-SECRETS-004]
      severity_hint: CRITICAL
      confidence: MEDIUM
      note: >-
        Matches a literal of 20 or more characters with letters and digits, so a long label or a hash such as a file digest can
        match when it sits under a name containing key or token. The scanner never prints the value. The kit Gitleaks
        configuration is the primary check for committed secrets, this rule adds the assigned to a signing name view.
