rules:
  - id: hullproof-webhook-empty-secret-fallback
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A signing or verification secret falls back to an empty string (or the text "undefined") when the
      setting is missing. An HMAC with an empty key is valid, so anyone can sign a request, and the
      check passes without the secret being set. Fail at startup, or return an error on the request,
      when the secret is missing or empty.
    patterns:
      - pattern-either:
          - pattern: $C.createHmac($A, $S ?? "")
          - pattern: $C.createHmac($A, $S || "")
          - pattern: createHmac($A, $S ?? "")
          - pattern: createHmac($A, $S || "")
          - pattern: createHmac($A, String(process.env.$V))
          - pattern: $C.createHmac($A, String(process.env.$V))
          - pattern: createHmac($A, `${process.env.$V}`)
          - pattern: new Webhook($S ?? "")
          - pattern: new Webhook($S || "")
          - pattern: $W.webhooks.constructEvent($B, $SIG, $S ?? "")
          - pattern: $W.webhooks.constructEvent($B, $SIG, $S || "")
          - pattern: $W.webhooks.constructEventAsync($B, $SIG, $S ?? "")
          - pattern: $W.webhooks.constructEventAsync($B, $SIG, $S || "")
          - pattern: '$F({..., secret: $S ?? "", ...})'
          - pattern: '$F({..., secret: $S || "", ...})'
          - pattern: '$F({..., webhookSecret: $S ?? "", ...})'
          - pattern: '$F({..., webhookSecret: $S || "", ...})'
          - pattern: '$F({..., signingSecret: $S ?? "", ...})'
          - pattern: '$F({..., signingSecret: $S || "", ...})'
          - patterns:
              - pattern-either:
                  - pattern: const $N = process.env.$V ?? "";
                  - pattern: const $N = process.env.$V || "";
                  - pattern: let $N = process.env.$V ?? "";
                  - pattern: let $N = process.env.$V || "";
                  - pattern: const $N = String(process.env.$V);
              - metavariable-regex:
                  metavariable: $V
                  regex: (?i).*(secret|signing|hmac|webhook|signature|whsec).*
    metadata:
      sec_ids: [SEC-API-101]
      severity_hint: CRITICAL
      confidence: MEDIUM
      note: >-
        Node accepts an empty string as an HMAC key and the forged signature verifies. An undefined key
        throws, so the exposed idiom is the empty string default. The environment variable name must
        contain secret, signing, hmac, webhook, signature or whsec for the variable form.
  - id: hullproof-secret-compare-env
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A request value is compared to a secret read from the environment with a plain comparison. If the
      secret is not set and the request value is missing, both are undefined and the comparison passes.
      A bearer string built with the secret becomes the text "Bearer undefined", which a caller can send.
      Check that the secret is set and non empty first, then compare in constant time.
    patterns:
      - pattern-either:
          - pattern: $X === process.env.$V
          - pattern: $X !== process.env.$V
          - pattern: $X == process.env.$V
          - pattern: $X != process.env.$V
          - pattern: process.env.$V === $X
          - pattern: process.env.$V !== $X
          - pattern: $X === `Bearer ${process.env.$V}`
          - pattern: $X !== `Bearer ${process.env.$V}`
          - pattern: $X == `Bearer ${process.env.$V}`
          - pattern: $X != `Bearer ${process.env.$V}`
      - metavariable-regex:
          metavariable: $V
          regex: (?i).*(secret|token|api_?key|signing|hmac|webhook|signature|cron|password|passphrase).*
    metadata:
      sec_ids: [SEC-API-101, SEC-API-102]
      severity_hint: HIGH
      confidence: MEDIUM
      note: Also fires on a safe comparison made after an explicit check that the secret is set. Read the lines above it.
