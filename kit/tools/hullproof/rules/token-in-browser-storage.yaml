rules:
  - id: hullproof-token-in-browser-storage
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A token or session value is written to localStorage, sessionStorage or AsyncStorage. Use
      HttpOnly cookies on web and the platform keystore on mobile.
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem($K, $V)
          - pattern: window.localStorage.setItem($K, $V)
          - pattern: sessionStorage.setItem($K, $V)
          - pattern: window.sessionStorage.setItem($K, $V)
          - pattern: AsyncStorage.setItem($K, $V)
      - metavariable-regex:
          metavariable: $K
          regex: (?i).*(token|jwt|session|auth|secret|refresh|bearer).*
    metadata:
      sec_ids: [SEC-AUTH-022, SEC-WEB-013, SEC-MOBILE-002]
      severity_hint: HIGH
      confidence: MEDIUM
  - id: hullproof-token-value-in-browser-storage
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A variable named like a token is written to browser storage under a key that does not look
      like a token. The value is still a credential. Use HttpOnly cookies or the platform keystore.
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem($K, $V)
          - pattern: window.localStorage.setItem($K, $V)
          - pattern: sessionStorage.setItem($K, $V)
          - pattern: AsyncStorage.setItem($K, $V)
      - metavariable-regex:
          metavariable: $V
          regex: (?i).*(token|jwt|accessToken|refreshToken|secret).*
    metadata:
      sec_ids: [SEC-AUTH-022, SEC-WEB-013, SEC-MOBILE-002]
      severity_hint: HIGH
      confidence: MEDIUM
